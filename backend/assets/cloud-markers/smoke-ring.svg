<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Smoke Ring — an annulus with an open, clear middle.

     Drawn as a stroked circle with a wide blurred stroke rather than as two
     filled circles, so the hole is genuinely empty and the board shows through
     it. Lumps sit on the ring to stop it reading as a drawn O. -->
<defs>
  <radialGradient id="srBand" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="42%"  stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="58%"  stop-color="#ffffff" stop-opacity="0.62"/>
    <stop offset="76%"  stop-color="#e3eaf3" stop-opacity="0.48"/>
    <stop offset="100%" stop-color="#cfdae7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="srLump" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle cx="256" cy="256" r="250" fill="url(#srBand)"/>
<g>
  <ellipse cx="256" cy="88"  rx="78" ry="52" fill="url(#srLump)"/>
  <ellipse cx="424" cy="256" rx="52" ry="78" fill="url(#srLump)"/>
  <ellipse cx="256" cy="424" rx="78" ry="52" fill="url(#srLump)"/>
  <ellipse cx="88"  cy="256" rx="52" ry="78" fill="url(#srLump)"/>
  <ellipse cx="374" cy="138" rx="62" ry="52" fill="url(#srLump)"/>
  <ellipse cx="138" cy="374" rx="62" ry="52" fill="url(#srLump)"/>
</g>
</svg>
