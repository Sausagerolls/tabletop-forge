<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Ion Storm — a charged cloud with arcs crawling through it. Drawn with a
     soft body and hard bright bolts: the contrast between the two is what says
     "electrical" rather than "blue fog". -->
<defs>
  <radialGradient id="isBody" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#cfe4ff" stop-opacity="0.42"/>
    <stop offset="45%"  stop-color="#5b7cc7" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#2b3f6b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="isHot" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#e6d4ff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#e6d4ff" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle cx="256" cy="256" r="250" fill="url(#isBody)"/>
<g>
  <ellipse cx="180" cy="200" rx="96" ry="72" fill="url(#isHot)"/>
  <ellipse cx="330" cy="290" rx="88" ry="66" fill="url(#isHot)"/>
  <ellipse cx="250" cy="350" rx="80" ry="58" fill="url(#isHot)"/>
</g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M96 210 L148 178 L136 232 L196 196 L182 250 L246 214"
        stroke="#e8f2ff" stroke-width="5" opacity="0.95"/>
  <path d="M300 128 L326 176 L292 190 L338 236 L306 252 L352 300"
        stroke="#bfe0ff" stroke-width="4.5" opacity="0.85"/>
  <path d="M150 330 L204 316 L188 362 L248 344 L232 388 L296 366"
        stroke="#d9c6ff" stroke-width="4" opacity="0.8"/>
  <path d="M366 190 L406 220 L372 246 L414 282"
        stroke="#e8f2ff" stroke-width="3.5" opacity="0.7"/>
  <path d="M124 268 L96 306 L140 318"
        stroke="#bfe0ff" stroke-width="3" opacity="0.6"/>
</g>
</svg>
