<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Blood Pool, from above.

     Someone bled out here: a settled pool with a thinner lobe running
     off where the floor fell away, ringed by the spatter of the wound
     itself.

     NO background rect — deliberately. The piece is dropped ON a map, so
     everything but the blood is transparent and the bodies are part-
     translucent, letting stone, timber or grass read through the way a real
     wet stain does.

     Blood is dark, which is the trap: a deep red pool disappears on a dark
     floor. So the piece carries BOTH directions of contrast — a soaked-in
     halo darker than the blood for pale floors, and saturated mid-reds plus
     wet specular glints for dark ones.

     Generated procedurally (seed 7301) so no two placements of the set
     repeat a pattern the eye can pick up. -->
<defs>
  <!-- Thick blood is DARK. It lightens only where it thins at the rim, and
       goes part-transparent there too, which is also what lets the floor
       texture read through the edge of a stain. -->
  <radialGradient id="bPool" cx="46%" cy="44%" r="60%">
    <stop offset="0%"   stop-color="#330508"/>
    <stop offset="62%"  stop-color="#4a080b"/>
    <stop offset="90%"  stop-color="#651014"/>
    <stop offset="100%" stop-color="#7a1418" stop-opacity="0.8"/>
  </radialGradient>
  <radialGradient id="bDrop" cx="42%" cy="38%" r="66%">
    <stop offset="0%"   stop-color="#4e070a"/>
    <stop offset="65%"  stop-color="#6d0f13"/>
    <stop offset="100%" stop-color="#8a171a" stop-opacity="0.9"/>
  </radialGradient>
  <radialGradient id="bSheen" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffb3ad" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#ffb3ad" stop-opacity="0"/>
  </radialGradient>
  <!-- The stain that soaks INTO the floor around the edge. It is what gives
       the piece a dark halo on a pale floor and a saturated one on a dark
       floor, so it reads either way. -->
  <filter id="bSoak" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="4.5"/>
  </filter>
  <filter id="bSoft" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="1.6"/>
  </filter>
</defs>
