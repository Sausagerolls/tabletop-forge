  <line x1="122.2" y1="221" x2="106.7" y2="214"/>
  <line x1="151" y1="178.2" x2="140.1" y2="167.4"/>
  <line x1="198" y1="143.3" x2="191.8" y2="131.1"/>
</g>
<g stroke="#e9deff" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round">
