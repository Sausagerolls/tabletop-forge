  <polygon points="113.4,212.2 99.2,185.7 106.7,214" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
  <polygon points="149.1,184.2 186.5,189.7 152.9,172.2" fill="url(#cvFaceMid)"/>
  <polygon points="149.1,184.2 186.5,189.7 151,178.2" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
  <polygon points="197.5,130.9 190,88 186.2,131.4" fill="url(#cvFaceMid)"/>
  <polygon points="197.5,130.9 190,88 191.8,131.1" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
</g>

