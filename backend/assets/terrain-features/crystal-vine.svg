</g>
<polygon points="254.2,305.5 261.7,308 263.2,319.2 253.6,335.3 232.3,348.1 203.3,353.6 171.3,348.5 142,331.4 120.8,302.6 112.9,264.5 122.2,221 151,178.2 198,143.3 259.1,122.8 256.7,111.1 191.8,131.1 140.1,167.4 106.7,214 93.9,264 101.6,310.7 126.3,348 162.3,371.8 202.8,380.8 241.6,376.2 273.7,360.6 297.4,338.1 310.6,309.6 310.3,279.1"
         fill="none" stroke="#1b0b3d" stroke-width="2.5" stroke-linejoin="round"/>
<!-- Seams where one crystal block ends and the next begins. Without them the
     stalk is a smooth tapering tube with facet shading painted on; with them it
     is a run of prisms that grew end to end, which is the whole idea. -->
<g stroke="#1b0b3d" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round">
  <line x1="261.7" y1="308" x2="310.6" y2="309.6"/>
  <line x1="263.2" y1="319.2" x2="297.4" y2="338.1"/>
  <line x1="253.6" y1="335.3" x2="273.7" y2="360.6"/>
