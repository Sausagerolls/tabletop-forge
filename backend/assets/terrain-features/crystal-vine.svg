  <polygon points="254.2,305.5 261.7,308 286.1,308.8 282.3,292.3" fill="#bd9bfa"/>
  <polygon points="282.3,292.3 286.1,308.8 310.6,309.6 310.3,279.1" fill="#8b5cf6"/>
  <polygon points="261.7,308 263.2,319.2 280.3,328.7 286.1,308.8" fill="#efe4ff"/>
  <polygon points="286.1,308.8 280.3,328.7 297.4,338.1 310.6,309.6" fill="#3d1888"/>
  <polygon points="263.2,319.2 253.6,335.3 263.7,347.9 280.3,328.7" fill="#efe4ff"/>
