<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Crystal Vine, from above.

     A single crystalline stalk breaking out of the ground and coiling upward
     and outward, throwing off shards as it climbs, opening into a rosette at
     the growing tip. Overhead that reads as a spiral: the base is the tight
     centre, the crown the far end of the coil.

     Drawn to be READ at a 3-square footprint on a busy battlemap, so the value
     range does the work — near-black shade against near-white lit faces, with
     the cyan core the only saturated thing in the piece. The 3D view grows the
     same vine as real geometry (three_d_shape 'vine'); this is what the flat
     board shows. -->
<defs>
  <linearGradient id="cvFaceLit" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#f0e9ff"/>
    <stop offset="55%"  stop-color="#c3a9ff"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="cvFaceMid" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#a684f5"/>
    <stop offset="60%"  stop-color="#6d35c9"/>
    <stop offset="100%" stop-color="#3f1a86"/>
  </linearGradient>
  <linearGradient id="cvFaceDark" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#4a1f9c"/>
    <stop offset="70%"  stop-color="#2a0f63"/>
    <stop offset="100%" stop-color="#190839"/>
  </linearGradient>
  <radialGradient id="cvGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#67e8f9" stop-opacity="0.55"/>
    <stop offset="45%"  stop-color="#7c3aed" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cvCore" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="35%"  stop-color="#a5f3fc" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cvSoil" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#0d0a12" stop-opacity="0.9"/>
    <stop offset="55%"  stop-color="#241c2e" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#241c2e" stop-opacity="0"/>
  </radialGradient>
  <filter id="cvSoft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<!-- Light thrown onto the ground by the vine itself, under everything. -->
<ellipse cx="264" cy="246" rx="236" ry="212" fill="url(#cvGlow)"/>

<!-- Heaved earth around the breach. -->
<ellipse cx="282.3" cy="292.3" rx="66" ry="58" fill="url(#cvSoil)" opacity="0.8"/>
<g stroke="#120d18" stroke-opacity="0.85" fill="none" stroke-linecap="round">
  <path d="M301,302.7 Q317.1,312.3 334.8,329" stroke-width="3.2" stroke-opacity="0.8"/>
  <path d="M281.7,312.3 Q280.5,355.6 268.5,391.9" stroke-width="2.4" stroke-opacity="0.6"/>
  <path d="M262.9,301.8 Q237.5,315 206.5,321.5" stroke-width="1.6" stroke-opacity="0.4"/>
  <path d="M263.5,281.8 Q216,254.3 182.4,222.4" stroke-width="3.2" stroke-opacity="0.8"/>
  <path d="M282.8,272.3 Q283.9,235.2 294.7,202.5" stroke-width="2.4" stroke-opacity="0.6"/>
  <path d="M301.6,282.7 Q321.2,272.5 348.1,266.9" stroke-width="1.6" stroke-opacity="0.4"/>
</g>

<!-- The coil's own shadow, offset down-right from the light. -->
<g opacity="0.5" filter="url(#cvSoft)">
  <polygon points="254.2,305.5 261.7,308 263.2,319.2 253.6,335.3 232.3,348.1 203.3,353.6 171.3,348.5 142,331.4 120.8,302.6 112.9,264.5 122.2,221 151,178.2 198,143.3 259.1,122.8 256.7,111.1 191.8,131.1 140.1,167.4 106.7,214 93.9,264 101.6,310.7 126.3,348 162.3,371.8 202.8,380.8 241.6,376.2 273.7,360.6 297.4,338.1 310.6,309.6 310.3,279.1"
           fill="#0a0616" transform="translate(9 11)"/>
</g>

<!-- Branch shards sit UNDER the stalk so they read as growing out of it. -->
<g stroke="#1b0b3d" stroke-width="2" stroke-linejoin="round">
  <polygon points="243.8,295 227.4,355.1 279.6,321" fill="url(#cvFaceMid)"/>
  <polygon points="243.8,295 227.4,355.1 261.7,308" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
