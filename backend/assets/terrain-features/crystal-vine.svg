<!-- The lit ridge running the length of the coil — the specular line that makes
     it read as glass rather than stone. -->
<polyline points="282.3,292.3 286.1,308.8 280.3,328.7 263.7,347.9 236.9,362.1 203,367.2 166.8,360.2 134.1,339.7 111.2,306.7 103.4,264.2 114.4,217.5 145.5,172.8 194.9,137.2 257.9,116.9" fill="none" stroke="#67e8f9" stroke-opacity="0.45"
          stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#cvSoft)"/>
<polyline points="282.3,292.3 286.1,308.8 280.3,328.7 263.7,347.9 236.9,362.1 203,367.2 166.8,360.2 134.1,339.7 111.2,306.7 103.4,264.2 114.4,217.5 145.5,172.8 194.9,137.2 257.9,116.9" fill="none" stroke="#f5f3ff" stroke-opacity="0.42"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- The lip of the hole, drawn OVER the stalk's buried end so the vine goes
     INTO the ground instead of stopping at a clean cut edge. -->
<ellipse cx="282.3" cy="292.3" rx="27" ry="23" fill="#150f1f" opacity="0.9"
         transform="rotate(76.9 282.3 292.3)"/>
<ellipse cx="282.3" cy="292.3" rx="27" ry="23" fill="none" stroke="#3b2f47"
         stroke-width="3" opacity="0.8"
         transform="rotate(76.9 282.3 292.3)"/>

<!-- Small crystals pushing through the broken ground. -->
<g stroke="#1b0b3d" stroke-width="1.6" stroke-linejoin="round">
  <polygon points="267.8,317.8 262.5,329.3 274.8,323.4" fill="url(#cvFaceMid)"/>
