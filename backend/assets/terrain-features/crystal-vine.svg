  <polygon points="193.6,373.8 149.4,450.4 202.8,380.8" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
  <polygon points="181.4,344.8 153.5,300 161.2,352.2" fill="url(#cvFaceMid)"/>
  <polygon points="181.4,344.8 153.5,300 171.3,348.5" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
  <polygon points="125.4,338.1 61.8,354.1 127.2,357.9" fill="url(#cvFaceMid)"/>
  <polygon points="125.4,338.1 61.8,354.1 126.3,348" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
  <polygon points="128.6,307.3 159.5,237.6 113,298" fill="url(#cvFaceMid)"/>
  <polygon points="128.6,307.3 159.5,237.6 120.8,302.6" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
  <polygon points="104.9,303 60,292.7 98.3,318.4" fill="url(#cvFaceMid)"/>
  <polygon points="104.9,303 60,292.7 101.6,310.7" fill="url(#cvFaceLit)" opacity="0.85" stroke="none"/>
