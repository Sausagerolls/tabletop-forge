<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Alien Tentacle — rearing: one heavy limb sweeping out of the ground
     and hooking back over itself.

     Drawn from overhead for the flat board; the 3D view grows the same limb as
     real geometry and writhes it (three_d_shape 'tentacle', piece_form
     'rearing'). Bruised violet-crimson rather than the crystal vine's clean
     amethyst, so the two sets never get confused at a glance on a busy map, and
     a sickly green rim light for the part of "alien" that colour has to carry.

     Generated — see scratchpad/gen-tentacle.js. -->
<defs>
  <linearGradient id="tSkin" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#c2456b"/>
    <stop offset="55%"  stop-color="#7e1f47"/>
    <stop offset="100%" stop-color="#3b0d2e"/>
  </linearGradient>
  <linearGradient id="tLit" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#f4a7bd" stop-opacity="0.95"/>
    <stop offset="60%"  stop-color="#c2456b" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#7e1f47" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="tSucker" cx="42%" cy="38%" r="62%">
    <stop offset="0%"   stop-color="#ffe0c6"/>
    <stop offset="55%"  stop-color="#d79a86"/>
    <stop offset="100%" stop-color="#5c1c33"/>
  </radialGradient>
  <radialGradient id="tHole" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#07040a" stop-opacity="1"/>
    <stop offset="62%"  stop-color="#1b0a1b" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#1b0a1b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tOoze" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#66d9a3" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#66d9a3" stop-opacity="0"/>
  </radialGradient>
  <filter id="tSoft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>

