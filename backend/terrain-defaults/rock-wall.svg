<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" preserveAspectRatio="none">
  <!--
    Drystone wall, viewed straight down. The wall reads as a 5:1 strip
    of capstones laid lengthwise. Mortar/dirt fills the gaps; each
    stone is its own irregular polygon with a slight inner-shadow on
    one edge to imply a small height-step. A faint cast shadow on the
    south edge gives the wall some perceived thickness from above.
  -->
  <defs>
    <radialGradient id="stoneRA" cx="40%" cy="35%" r="80%">
      <stop offset="0%"  stop-color="#bbb4a6"/>
      <stop offset="55%" stop-color="#827b6e"/>
      <stop offset="100%" stop-color="#4a463e"/>
    </radialGradient>
    <radialGradient id="stoneRB" cx="40%" cy="40%" r="80%">
      <stop offset="0%"  stop-color="#a8a193"/>
      <stop offset="55%" stop-color="#736e62"/>
      <stop offset="100%" stop-color="#3d3a32"/>
    </radialGradient>
    <radialGradient id="stoneRC" cx="38%" cy="32%" r="80%">
      <stop offset="0%"  stop-color="#cac3b4"/>
      <stop offset="55%" stop-color="#928c7e"/>
      <stop offset="100%" stop-color="#52504a"/>
    </radialGradient>
    <radialGradient id="stoneRD" cx="40%" cy="35%" r="80%">
      <stop offset="0%"  stop-color="#a59f91"/>
      <stop offset="55%" stop-color="#79735f"/>
      <stop offset="100%" stop-color="#3a3730"/>
    </radialGradient>
    <pattern id="moss2" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="6"  cy="8"  r="0.9" fill="#3a4f2c" opacity="0.55"/>
      <circle cx="22" cy="3"  r="0.7" fill="#46622f" opacity="0.45"/>
      <circle cx="34" cy="14" r="0.8" fill="#3a4f2c" opacity="0.5"/>
      <circle cx="14" cy="22" r="0.9" fill="#46622f" opacity="0.5"/>
      <circle cx="28" cy="30" r="0.7" fill="#3a4f2c" opacity="0.45"/>
      <circle cx="6"  cy="34" r="0.8" fill="#46622f" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- mortar / dirt base -->
  <rect width="500" height="100" fill="#2c2924"/>
  <rect width="500" height="100" fill="#1f1d1a" opacity="0.5"/>

  <!-- single course of irregular cap stones, laid lengthwise -->
  <g stroke="#16140f" stroke-width="1.4" stroke-linejoin="round">
    <path d="M-2 18 L18 12 L42 16 L52 26 L48 76 L26 86 L4 80 L-2 68 Z" fill="url(#stoneRA)"/>
    <path d="M54 14 L96 12 L114 22 L110 78 L86 86 L60 82 L52 70 L52 30 Z" fill="url(#stoneRC)"/>
    <path d="M118 16 L154 12 L172 24 L170 76 L146 86 L122 80 L114 70 L116 30 Z" fill="url(#stoneRB)"/>
    <path d="M176 14 L214 12 L232 22 L230 76 L208 86 L182 84 L172 70 L172 32 Z" fill="url(#stoneRD)"/>
    <path d="M236 14 L274 12 L292 22 L290 76 L268 86 L244 84 L232 70 L232 32 Z" fill="url(#stoneRC)"/>
    <path d="M296 14 L334 12 L354 22 L352 76 L330 86 L302 84 L292 70 L292 32 Z" fill="url(#stoneRA)"/>
    <path d="M358 16 L394 12 L416 22 L414 76 L388 86 L362 84 L352 70 L354 32 Z" fill="url(#stoneRB)"/>
    <path d="M420 14 L460 12 L480 24 L476 76 L452 86 L424 84 L414 70 L414 32 Z" fill="url(#stoneRD)"/>
    <path d="M484 14 L502 12 L502 86 L488 86 L478 76 L478 28 Z" fill="url(#stoneRC)"/>
  </g>

  <!-- top-edge highlights to imply a tiny lip facing the sun (NW) -->
  <g fill="#ece6d4" opacity="0.45">
    <path d="M-2 18 L18 12 L42 16 L52 26 L42 22 L18 18 L4 22 Z"/>
    <path d="M54 14 L96 12 L114 22 L94 18 L70 16 L56 18 Z"/>
    <path d="M118 16 L154 12 L172 24 L150 18 L130 18 L120 20 Z"/>
    <path d="M176 14 L214 12 L232 22 L210 18 L188 16 L180 18 Z"/>
    <path d="M236 14 L274 12 L292 22 L268 18 L246 16 L240 18 Z"/>
    <path d="M296 14 L334 12 L354 22 L330 18 L306 16 L300 18 Z"/>
    <path d="M358 16 L394 12 L416 22 L394 18 L370 18 L362 20 Z"/>
    <path d="M420 14 L460 12 L480 24 L458 18 L432 16 L424 18 Z"/>
  </g>

  <!-- bottom-edge cast shadow for perceived height -->
  <g fill="#0d0c0a" opacity="0.5">
    <path d="M-2 78 L48 76 L52 84 L4 90 L-2 88 Z"/>
    <path d="M52 76 L110 78 L114 84 L60 90 L52 88 Z"/>
    <path d="M114 78 L170 76 L174 84 L122 88 L114 88 Z"/>
    <path d="M172 78 L230 76 L234 84 L182 88 L172 88 Z"/>
    <path d="M232 78 L290 76 L294 84 L244 88 L232 88 Z"/>
    <path d="M292 78 L352 76 L356 84 L302 88 L292 88 Z"/>
    <path d="M354 78 L414 76 L418 84 L362 88 L354 88 Z"/>
    <path d="M414 78 L476 76 L482 84 L424 88 L414 88 Z"/>
    <path d="M478 78 L502 80 L502 90 L488 90 Z"/>
  </g>

  <!-- inner-stone surface details: cracks + tiny chips -->
  <g stroke="#1c1a17" stroke-width="0.9" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M14 36 Q22 44 16 56"/>
    <path d="M36 56 Q42 64 38 72"/>
    <path d="M76 36 Q86 48 80 64"/>
    <path d="M96 58 Q104 68 100 78"/>
    <path d="M134 38 Q144 50 140 64"/>
    <path d="M158 56 Q166 64 162 74"/>
    <path d="M194 36 Q204 50 198 64"/>
    <path d="M218 56 Q224 66 220 76"/>
    <path d="M254 36 Q264 50 258 64"/>
    <path d="M278 58 Q284 68 280 78"/>
    <path d="M314 38 Q322 50 318 64"/>
    <path d="M338 58 Q346 68 342 76"/>
    <path d="M374 36 Q384 48 378 62"/>
    <path d="M398 58 Q406 68 402 78"/>
    <path d="M436 38 Q446 50 440 64"/>
    <path d="M462 58 Q470 68 466 76"/>
  </g>
  <g fill="#1c1a17" opacity="0.7">
    <circle cx="22" cy="50" r="0.9"/>
    <circle cx="46" cy="62" r="0.9"/>
    <circle cx="86" cy="50" r="0.9"/>
    <circle cx="148" cy="48" r="0.9"/>
    <circle cx="186" cy="60" r="0.9"/>
    <circle cx="222" cy="48" r="0.9"/>
    <circle cx="266" cy="58" r="0.9"/>
    <circle cx="320" cy="48" r="0.9"/>
    <circle cx="356" cy="60" r="0.9"/>
    <circle cx="392" cy="46" r="0.9"/>
    <circle cx="442" cy="58" r="0.9"/>
    <circle cx="476" cy="50" r="0.9"/>
  </g>

  <!-- moss tufts overlay -->
  <rect width="500" height="100" fill="url(#moss2)"/>
</svg>
