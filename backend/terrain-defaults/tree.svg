<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" preserveAspectRatio="xMidYMid meet">
  <!--
    Top-down deciduous tree. Three layered foliage rings (outer dark,
    mid green, top highlight) built out of overlapping irregular ellipses
    so the silhouette feels organic rather than perfectly circular.
    Trunk peeks through the centre with a hint of bark texture; cast
    shadow on the ground hints at sun direction (upper-left).
  -->
  <defs>
    <radialGradient id="canopyMid" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ea84e"/>
      <stop offset="55%" stop-color="#3f8438"/>
      <stop offset="100%" stop-color="#234e22"/>
    </radialGradient>
    <radialGradient id="canopyHi" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#9ad469"/>
      <stop offset="60%" stop-color="#5da348"/>
      <stop offset="100%" stop-color="#3a7a35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="trunkBark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5230"/>
      <stop offset="60%" stop-color="#4a311e"/>
      <stop offset="100%" stop-color="#2a1d12"/>
    </radialGradient>
    <radialGradient id="treeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0c0a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d0c0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow, offset down-right of canopy to imply sun upper-left -->
  <ellipse cx="138" cy="148" rx="90" ry="78" fill="url(#treeShadow)"/>

  <!-- outer dark canopy ring (organic outline) -->
  <g fill="#1c3a1c">
    <path d="M120 24
             C170 24 198 50 208 84
             C220 116 214 152 198 178
             C180 206 152 220 122 220
             C92 220 64 208 46 184
             C28 158 22 124 30 92
             C40 56 70 28 120 24 Z"/>
  </g>

  <!-- mid canopy: cluster of overlapping ellipses for a leafy edge -->
  <g fill="url(#canopyMid)" stroke="#1f3d1d" stroke-width="0.8">
    <ellipse cx="74"  cy="78"  rx="42" ry="36"/>
    <ellipse cx="116" cy="58"  rx="46" ry="34"/>
    <ellipse cx="170" cy="78"  rx="42" ry="36"/>
    <ellipse cx="56"  cy="124" rx="40" ry="36"/>
    <ellipse cx="120" cy="118" rx="56" ry="46"/>
    <ellipse cx="186" cy="124" rx="40" ry="36"/>
    <ellipse cx="78"  cy="170" rx="40" ry="36"/>
    <ellipse cx="124" cy="180" rx="44" ry="34"/>
    <ellipse cx="170" cy="170" rx="40" ry="36"/>
  </g>

  <!-- mid-canopy texture: tighter inner shapes adding shape variation -->
  <g fill="#3d8138" opacity="0.95">
    <circle cx="98" cy="98" r="22"/>
    <circle cx="142" cy="92" r="20"/>
    <circle cx="100" cy="146" r="24"/>
    <circle cx="148" cy="148" r="22"/>
    <circle cx="120" cy="120" r="28"/>
  </g>

  <!-- top highlight: lighter foliage on the upper-left like sun on top -->
  <g fill="url(#canopyHi)">
    <ellipse cx="92"  cy="74" rx="34" ry="22"/>
    <ellipse cx="132" cy="60" rx="30" ry="18"/>
    <ellipse cx="80"  cy="108" rx="26" ry="18"/>
    <ellipse cx="116" cy="98"  rx="26" ry="18"/>
  </g>

  <!-- individual leaf cluster highlights -->
  <g fill="#a9d97a" opacity="0.85">
    <ellipse cx="84"  cy="72" rx="11" ry="6" transform="rotate(-20 84 72)"/>
    <ellipse cx="118" cy="56" rx="12" ry="6" transform="rotate(-8 118 56)"/>
    <ellipse cx="68"  cy="98" rx="10" ry="5" transform="rotate(-30 68 98)"/>
    <ellipse cx="110" cy="98" rx="10" ry="5" transform="rotate(-12 110 98)"/>
    <ellipse cx="146" cy="74" rx="10" ry="5" transform="rotate(15 146 74)"/>
  </g>
  <g fill="#7bbe55" opacity="0.7">
    <ellipse cx="148" cy="118" rx="9" ry="4.5" transform="rotate(20 148 118)"/>
    <ellipse cx="92"  cy="138" rx="9" ry="4.5" transform="rotate(-15 92 138)"/>
    <ellipse cx="132" cy="158" rx="10" ry="5" transform="rotate(10 132 158)"/>
    <ellipse cx="178" cy="146" rx="9" ry="4.5" transform="rotate(25 178 146)"/>
  </g>

  <!-- shadow gap revealing the trunk -->
  <ellipse cx="120" cy="120" rx="20" ry="20" fill="#163018" opacity="0.55"/>

  <!-- trunk (top-down cross-section) -->
  <g>
    <ellipse cx="120" cy="120" rx="14" ry="14" fill="url(#trunkBark)" stroke="#1d1006" stroke-width="1.2"/>
    <!-- growth rings -->
    <circle cx="120" cy="120" r="10" fill="none" stroke="#3a261a" stroke-width="0.7" opacity="0.7"/>
    <circle cx="120" cy="120" r="6.5" fill="none" stroke="#3a261a" stroke-width="0.6" opacity="0.6"/>
    <circle cx="120" cy="120" r="3" fill="#2a1a10"/>
    <!-- bark cracks -->
    <path d="M114 110 Q116 117 113 124" stroke="#1d1006" stroke-width="0.8" fill="none"/>
    <path d="M126 110 Q124 117 127 124" stroke="#1d1006" stroke-width="0.8" fill="none"/>
  </g>

  <!-- outer fluff: a few leaves breaking the silhouette -->
  <g fill="#3f8438" stroke="#1f3d1d" stroke-width="0.6">
    <ellipse cx="40"  cy="78"  rx="9" ry="6" transform="rotate(-25 40 78)"/>
    <ellipse cx="200" cy="74"  rx="9" ry="6" transform="rotate(20 200 74)"/>
    <ellipse cx="38"  cy="158" rx="9" ry="6" transform="rotate(20 38 158)"/>
    <ellipse cx="208" cy="160" rx="9" ry="6" transform="rotate(-20 208 160)"/>
    <ellipse cx="118" cy="32"  rx="10" ry="6" transform="rotate(0 118 32)"/>
    <ellipse cx="120" cy="216" rx="10" ry="6"/>
  </g>
</svg>
