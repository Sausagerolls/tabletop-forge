server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to backend. The `^~` prefix forces nginx to skip the regex
    # cache rule below for any /api/ path — without it, requests like
    # /api/plugins/<id>/asset/client.js get hijacked by the .js regex
    # location and returned as static-file 404s.
    # Bringing a whole install back in.
    #
    # A session pack is the entire server — every map, every piece of art — and a
    # real campaign is comfortably past the 200M that suits ordinary uploads. Its
    # own location block, so raising the ceiling this far applies to exactly one
    # endpoint rather than to every POST the API takes.
    #
    # `proxy_request_buffering off` streams the body straight through instead of
    # spooling half a gigabyte into nginx's temp directory first, which on this
    # box is a container filesystem and not somewhere to put 500MB.
    location = /api/transfer/import {
        proxy_pass http://backend:3001/api/transfer/import;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4G;
        proxy_request_buffering off;
        proxy_buffering off;
        # Importing 5,000 rows and unzipping 600 files takes a while, and a
        # timeout here would look like a failed import that had in fact worked.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location ^~ /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 200M;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        # Disable response buffering so streamed scan progress (NDJSON) flushes
        # to the browser one event at a time instead of being held in nginx.
        proxy_buffering off;
    }

    # Proxy Socket.io to backend
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Proxy sound files to backend
    location ^~ /sounds/ {
        proxy_pass http://backend:3001/sounds/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy uploaded files to backend (^~ prevents regex cache rule from stealing these)
    location ^~ /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # PWA manifest. Some browsers reject the manifest if served as
    # text/plain (which alpine nginx defaults to for .webmanifest), so
    # we set the spec-correct MIME type explicitly. Also disable the
    # CDN/edge cache so a manifest version bump rolls out immediately.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # PWA service worker. MUST be served from the root so the worker's
    # default scope is the whole site. no-cache is the recommended
    # default — without it, an upstream cache holding the old sw.js
    # for hours would block users from receiving updated app shells.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # The app shell. Vite fingerprints every asset it references, so a stale
    # index.html points at hashed files the rebuilt image no longer has — the
    # browser 404s on the entry bundle and renders nothing at all. Without an
    # explicit header here nginx sends none, and browsers fall back to
    # heuristic caching (a fraction of Last-Modified age), which is enough to
    # strand one machine on a white page while every other machine is fine.
    # must-revalidate, not no-store: the ETag still saves the round trip when
    # nothing changed.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # React SPA — all other routes serve index.html. try_files re-enters
    # location matching for the fallback, so the exact-match block above is
    # what stamps the header on it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. Safe to hold indefinitely because the filenames are
    # content-hashed — a new build produces new names rather than new contents
    # under an old name.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
