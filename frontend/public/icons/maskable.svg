<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable icon — content is intentionally constrained to the inner 80%
  safe zone (per the W3C maskable spec) so OS launchers that crop into a
  circle/squircle/rounded-square don't clip anything important. The full
  bleed background is the brand parchment red so the cropped edge still
  looks intentional.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#7c2828"/>
  <!-- Same composition as icon.svg, scaled to ~64% so all of it sits
       comfortably inside the 80% maskable safe zone (≈ 51..461). -->
  <g transform="translate(256,256) scale(0.64) translate(-256,-256)">
    <circle cx="256" cy="256" r="220" fill="#1a1f2e" stroke="#3a0e0e" stroke-width="14"/>

    <g transform="translate(256,288)">
      <path d="M -120 0 L -90 -34 L 90 -34 L 120 0 L 110 18 L -110 18 Z"
            fill="#3a3f4e" stroke="#0a0d14" stroke-width="6"/>
      <rect x="-46" y="18" width="92" height="50" fill="#2c303d" stroke="#0a0d14" stroke-width="6"/>
      <rect x="-78" y="68" width="156" height="22" fill="#202430" stroke="#0a0d14" stroke-width="6"/>
    </g>

    <g transform="translate(180,170) rotate(-32)">
      <rect x="-12" y="-110" width="24" height="180" rx="4" fill="#b08646" stroke="#3a2a14" stroke-width="6"/>
      <rect x="-50" y="-150" width="100" height="50" rx="6" fill="#5a6273" stroke="#0a0d14" stroke-width="6"/>
    </g>

    <g fill="#f5b04a">
      <circle cx="312" cy="232" r="6"/>
      <circle cx="338" cy="218" r="4"/>
      <circle cx="296" cy="208" r="3"/>
      <circle cx="356" cy="248" r="5"/>
    </g>
  </g>
</svg>
