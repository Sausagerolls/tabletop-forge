<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable variant — same crossed-hammers emblem but the meaningful
  composition is shrunk into the inner 80% safe zone (W3C spec) so
  adaptive launchers that crop into a circle / squircle / rounded-
  square don't clip anything. Background bleeds the brand red so
  the cropped edge still reads intentional.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#7c2828"/>

  <defs>
    <g id="hammer-m">
      <rect x="-16" y="-50" width="32" height="260" rx="6"
            fill="#b08646" stroke="#3a2a14" stroke-width="6"/>
      <rect x="-72" y="-94" width="144" height="62" rx="8"
            fill="#cfd4dc" stroke="#0a0d14" stroke-width="6"/>
      <rect x="-72" y="-94" width="144" height="14" rx="8"
            fill="#ffffff" opacity="0.18"/>
      <rect x="-72" y="-50" width="144" height="14" rx="2"
            fill="#0a0d14" opacity="0.55"/>
    </g>
  </defs>

  <!-- Inner medallion + crossed hammers, scaled to ~64% so the
       composition fits comfortably inside the 80% safe zone (≈ 51..461). -->
  <g transform="translate(256,256) scale(0.64)">
    <circle cx="0" cy="0" r="220" fill="#1a1f2e" stroke="#3a0e0e" stroke-width="14"/>
    <g transform="rotate(-32)"><use href="#hammer-m"/></g>
    <g transform="rotate(32)"><use href="#hammer-m"/></g>
    <g fill="#f5b04a">
      <circle cx="0"   cy="-114" r="6"/>
      <circle cx="-30" cy="-132" r="3"/>
      <circle cx="34"  cy="-132" r="4"/>
      <circle cx="0"   cy="-150" r="3"/>
    </g>
  </g>
</svg>
