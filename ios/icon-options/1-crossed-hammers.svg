<?xml version="1.0" encoding="UTF-8"?>
<!--
  Option 1: Crossed Hammers — picks up the existing PWA branding.
  Two stylised hammers crossed in front of an anvil silhouette with a
  starburst centred on the cross. Gold-on-navy keeps it distinctive at
  60pt and reads as forge-themed without being literal.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Solid navy background; iOS will round the corners automatically. -->
  <rect width="1024" height="1024" fill="#1a1a2e"/>

  <!-- Subtle radial vignette so the centre carries focus. -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="42%" r="60%">
      <stop offset="0%"  stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#f4d488"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8c6e26"/>
    </linearGradient>
    <linearGradient id="haftGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#5a3a1a"/>
      <stop offset="50%" stop-color="#7a5128"/>
      <stop offset="100%" stop-color="#5a3a1a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!-- Anvil silhouette (back layer). -->
  <g transform="translate(512 720)">
    <path d="M -260 0 L 260 0 L 230 -50 L -230 -50 Z
             M -180 -50 L 180 -50 L 200 -110 L 240 -110 L 240 -150 L -240 -150 L -240 -110 L -200 -110 Z
             M -120 0 L 120 0 L 100 90 L -100 90 Z"
          fill="url(#goldGradient)" stroke="#000" stroke-width="6"/>
  </g>

  <!-- First hammer, rotated -45°. -->
  <g transform="translate(512 460) rotate(-45)">
    <rect x="-260" y="-22" width="380" height="44" rx="8" fill="url(#haftGradient)" stroke="#000" stroke-width="4"/>
    <rect x="120" y="-90" width="160" height="180" rx="20" fill="url(#goldGradient)" stroke="#000" stroke-width="6"/>
    <rect x="180" y="-110" width="100" height="20" rx="6" fill="url(#goldGradient)" stroke="#000" stroke-width="4"/>
    <rect x="180" y="90" width="100" height="20" rx="6" fill="url(#goldGradient)" stroke="#000" stroke-width="4"/>
  </g>

  <!-- Second hammer, rotated +45°. -->
  <g transform="translate(512 460) rotate(45)">
    <rect x="-260" y="-22" width="380" height="44" rx="8" fill="url(#haftGradient)" stroke="#000" stroke-width="4"/>
    <rect x="120" y="-90" width="160" height="180" rx="20" fill="url(#goldGradient)" stroke="#000" stroke-width="6"/>
    <rect x="180" y="-110" width="100" height="20" rx="6" fill="url(#goldGradient)" stroke="#000" stroke-width="4"/>
    <rect x="180" y="90" width="100" height="20" rx="6" fill="url(#goldGradient)" stroke="#000" stroke-width="4"/>
  </g>

  <!-- Spark / star at the cross. -->
  <g transform="translate(512 460)" fill="#fff5cc">
    <path d="M 0 -60 L 14 -14 L 60 0 L 14 14 L 0 60 L -14 14 L -60 0 L -14 -14 Z"/>
    <circle r="14" fill="#fff"/>
  </g>
</svg>
