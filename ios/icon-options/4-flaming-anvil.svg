<?xml version="1.0" encoding="UTF-8"?>
<!--
  Option 4: Flaming anvil. Flame plume rising behind a centred anvil.
  Direct read on the "Forge" half of the brand, warmer palette than
  options 1-3 so it stands out on the home screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"  stop-color="#fb923c"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"  stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="anvil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%"  stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Soft warm glow behind the flame. -->
  <circle cx="512" cy="540" r="420" fill="url(#glow)"/>

  <!-- Outer flame plume. Asymmetric tongues for a hand-drawn feel. -->
  <g transform="translate(512 540)">
    <path d="M 0 -360
             C  90 -260   220 -200   180 -80
             C  280  -40   260  120   140  200
             C  220  140   240  240   160  300
             C  120  340    50  340     0  340
             C -50  340  -120  340  -160  300
             C -240  240  -220  140  -140  200
             C -260  120  -280  -40  -180  -80
             C -220 -200   -90 -260     0 -360 Z"
          fill="url(#flame)"/>

    <!-- Inner flame core. -->
    <path d="M 0 -240
             C  60 -160   140 -120   110  -50
             C  170  -10   160  100   80  150
             C  130  100   150  180   100  220
             C   60  250    20  240     0  240
             C -20  240  -60  250 -100  220
             C -150  180 -130  100  -80  150
             C -160  100 -170  -10 -110  -50
             C -140 -120  -60 -160     0 -240 Z"
          fill="url(#flameInner)"/>

    <!-- White-hot core. -->
    <path d="M 0 -110
             C  40 -60    70 -20    50  20
             C   80  60    50 110     0 130
             C -50 110   -80  60   -50  20
             C -70 -20  -40  -60     0 -110 Z"
          fill="#fffbe6"/>
  </g>

  <!-- Anvil sitting on top of the flame. -->
  <g transform="translate(512 760)">
    <!-- Base / foot. -->
    <rect x="-200" y="60" width="400" height="50" rx="8" fill="url(#anvil)" stroke="#000" stroke-width="6"/>
    <!-- Waist (hourglass). -->
    <path d="M -130 60 L -90 -10 L 90 -10 L 130 60 Z" fill="url(#anvil)" stroke="#000" stroke-width="6"/>
    <!-- Top plate + horn. -->
    <path d="M -240 -10 L 220 -10 L 250 -50 L 280 -50 L 280 -90 L -240 -90 Z" fill="url(#anvil)" stroke="#000" stroke-width="6"/>
  </g>
</svg>
