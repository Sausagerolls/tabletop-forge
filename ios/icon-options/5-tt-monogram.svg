<?xml version="1.0" encoding="UTF-8"?>
<!--
  Option 5: TT monogram. Heaviest-text option — interlocking serif TTs
  with a stylised sword crossing through. Most "app" of the five
  (looks like a launchpad icon for a tool, not a game).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7a1d1d"/>
      <stop offset="100%" stop-color="#3d0e0e"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#f4d488"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#7a5a1c"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Decorative outer ring. -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#goldFill)" stroke-width="14"/>
  <circle cx="512" cy="512" r="408" fill="none" stroke="url(#goldFill)" stroke-width="3" opacity="0.5"/>

  <!-- Two heavy serif T glyphs side-by-side, slightly offset/overlapped. -->
  <g fill="url(#goldFill)" stroke="#1a1a1a" stroke-width="6">
    <!-- Left T -->
    <g transform="translate(312 512)">
      <rect x="-130" y="-180" width="260" height="60" rx="6"/>
      <rect x="-30" y="-180" width="60" height="320" rx="6"/>
      <!-- Serif foot -->
      <rect x="-90" y="120" width="180" height="30" rx="6"/>
    </g>
    <!-- Right T -->
    <g transform="translate(660 512)">
      <rect x="-130" y="-180" width="260" height="60" rx="6"/>
      <rect x="-30" y="-180" width="60" height="320" rx="6"/>
      <rect x="-90" y="120" width="180" height="30" rx="6"/>
    </g>
  </g>

  <!-- Diagonal sword in front of the lettering, top-left to bottom-right. -->
  <g transform="translate(512 512) rotate(35)">
    <!-- Blade -->
    <polygon points="0,-380  18,-340  18,260  -18,260  -18,-340"
             fill="url(#silver)" stroke="#1a1a1a" stroke-width="5"/>
    <!-- Tip highlight -->
    <polygon points="0,-380  10,-345  -10,-345" fill="#f9fafb"/>
    <!-- Cross-guard -->
    <rect x="-120" y="245" width="240" height="34" rx="6" fill="url(#goldFill)" stroke="#1a1a1a" stroke-width="5"/>
    <!-- Grip -->
    <rect x="-22" y="275" width="44" height="100" rx="6" fill="#3d2c0e" stroke="#1a1a1a" stroke-width="5"/>
    <!-- Pommel -->
    <circle cx="0" cy="392" r="26" fill="url(#goldFill)" stroke="#1a1a1a" stroke-width="5"/>
  </g>
</svg>
