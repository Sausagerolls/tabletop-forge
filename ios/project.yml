name: TableTopForge
options:
  bundleIdPrefix: com.giantmushroom
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    # Mac Catalyst maps the iOS app to AppKit-backed windowing so
    # the same SwiftUI codebase runs as a real macOS app (resizable
    # window, menu bar, keyboard shortcuts) — not as a stretched
    # iPad. macCatalyst 17 ↔ macOS 14 (Sonoma) per Apple's table.
    macCatalyst: "17.0"

# Socket.IO via SPM. Pin to the same major the README documents so the
# generated project matches manual setups.
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0

targets:
  TableTopForge:
    type: application
    platform: iOS
    sources:
      - path: TableTopForge
    # User-owned signing config that survives every regenerate. The
    # xcconfig is REFERENCED by the generated project, not embedded —
    # so xcodegen never rewrites it, and whatever team / bundle id /
    # other build settings you put there stick across regenerations.
    configFiles:
      Debug:   TableTopForge/Config.xcconfig
      Release: TableTopForge/Config.xcconfig
    dependencies:
      - package: SocketIO
        product: SocketIO
    # Code-signing entitlements — XcodeGen generates the .entitlements
    # file from the dict below and wires CODE_SIGN_ENTITLEMENTS in
    # the build settings automatically. The sandbox keys are required
    # for Mac App Store submission (Apple Connect rejects the upload
    # without `app-sandbox = true`); harmless on iOS, which runs in
    # its own sandbox regardless of the file.
    #
    #   app-sandbox       — Mac App Store mandate. Defaults to deny on
    #                       everything outside the app's container.
    #   network.client    — Outbound TCP / UDP. Needed for the Socket.IO
    #                       + REST traffic to the user-supplied server,
    #                       and for the Bonjour / mDNS .local lookup
    #                       that resolves the GM's server on the LAN.
    #   device.camera     — Camera access for the stat block editor's
    #                       portrait photo capture (Mac Catalyst sandbox).
    #   device.microphone — Mic access, only used if a video is recorded
    #                       while picking a portrait (Mac Catalyst sandbox).
    entitlements:
      path: TableTopForge/TableTopForge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Mac Catalyst sandbox: the stat block editor web view's
        # portrait <input type=file> can invoke the camera / video
        # capture. A sandboxed Mac app silently fails the request
        # without these — the iOS variant ignores them.
        com.apple.security.device.camera: true
        com.apple.security.device.microphone: true
    info:
      path: TableTopForge/Info.plist
      properties:
        # App Transport Security: the app talks to the user-supplied
        # VTT server over LAN HTTP (no fixed hostname — the player
        # types it in at login). NSAllowsArbitraryLoads = true is an
        # App Store auto-reject; NSAllowsLocalNetworking = true is
        # the supported way to permit unencrypted LAN traffic.
        # Public-internet HTTP is still blocked by default.
        # NOTE: this does NOT cover Tailscale's 100.x CGNAT range —
        # if the deployment ever needs to reach a Tailscale-routed
        # server over plain HTTP we'll need to either add the IP as
        # an NSExceptionDomain or fall back to NSAllowsArbitraryLoads
        # with an App Review justification.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # iOS 14+ requires a privacy string the moment an app touches
        # the LAN. The system shows this verbatim in the permission
        # alert, so phrase it from the user's perspective.
        NSLocalNetworkUsageDescription: "TableTop Forge Companion needs local-network access to talk to your TableTop Forge server (the laptop running the game) so your character sheet and dice rolls stay in sync with the table."
        # The stat block editor (a web view) exposes an <input type=file>
        # for the character portrait. Tapping it lets iOS offer Camera /
        # Photo Library / video capture. iOS SIGABRTs the app the instant
        # any of those is chosen if the matching usage string is absent —
        # this is exactly the App Review crash on the "Take Photo" button.
        NSCameraUsageDescription: "TableTop Forge Companion uses the camera so you can take a photo for your character's portrait in the stat block editor."
        NSPhotoLibraryUsageDescription: "TableTop Forge Companion uses your photo library so you can pick an image for your character's portrait in the stat block editor."
        NSMicrophoneUsageDescription: "TableTop Forge Companion needs microphone access only if you record a video while choosing a character portrait."
        # An empty UILaunchScreen dict opts the app into modern
        # full-screen rendering on every iPhone/iPad frame size.
        # Without this iOS falls back to legacy letterboxing — what the
        # user saw as "zoomed in, doesn't fill the screen".
        UILaunchScreen:
          UIColorName: ""
        # Opt-in for ProMotion 120Hz on iPhone 13 Pro and later.
        # Without this key, SwiftUI / Core Animation cap the display
        # link at 60Hz on ProMotion devices for power-conservation
        # reasons. With it set true, the app uses the native refresh.
        CADisableMinimumFrameDurationOnPhone: true
        # NOTE: UIBackgroundModes intentionally omitted. We use
        # UNUserNotificationCenter for in-app whisper banners only —
        # not remote pushes — and declaring an unused background mode
        # is a known App Review red flag.
        # Supported orientations — phone is portrait-first, iPad is
        # all-orientations so it works on a stand.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Display name on the home screen.
        # iOS Springboard truncates icon labels at ~11–12 chars, so
        # the full "TableTop Forge Companion" gets cut to "TableTop
        # Fo…" under the icon. The App Store Connect listing name
        # ("TableTop Forge Companion") drives search + discovery and
        # stays untouched — CFBundleDisplayName is the on-device
        # label only and can diverge.
        CFBundleDisplayName: TT Companion
        # Mac App Store mandate. Apple Connect rejects the upload
        # without this — `LSApplicationCategoryType` slots the app
        # into the Mac App Store's primary category dropdown. UTI
        # values are documented at
        # https://developer.apple.com/documentation/bundleresources/information_property_list/lsapplicationcategorytype
        # `entertainment` matches the App Store listing's primary
        # category we picked in app-store/listing.md.
        LSApplicationCategoryType: public.app-category.entertainment
        # App Store Connect's encryption-export questionnaire pops up
        # at every TestFlight / App Store upload unless we set this
        # explicitly. We use only HTTPS (URLSession + Socket.IO over
        # WSS) and Apple's stock crypto on top of the user-typed
        # local IP — that's "exempt" under the standard exemption
        # for HTTPS / Apple-provided crypto. Setting false dismisses
        # the wizard.
        ITSAppUsesNonExemptEncryption: false
        # Public marketing version + build number. App Store rejects
        # uploads where these don't match the value the GM puts in
        # App Store Connect — keeping them here means a fresh
        # xcodegen run preserves whatever the latest release is.
        CFBundleShortVersionString: "1.9.17"
        CFBundleVersion: "5"
    settings:
      base:
        # DEVELOPMENT_TEAM is intentionally NOT set here — xcodegen
        # would otherwise rewrite it on every regenerate, clobbering
        # whatever you picked in Xcode → Signing & Capabilities. Pick
        # the team once in Xcode and it'll stick (it lives in your
        # xcuserdata for Personal Team signing).
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.giantmushroom.tabletopforgecomp
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # Mac Catalyst — produces a real macOS .app from the same
        # iOS sources. Same bundle id across the platform variants
        # so a TestFlight install on the Mac shows up alongside
        # the iOS one in App Store Connect, not as a separate app.
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        # Macs render iPad UI scale by default ("optimized for iPad");
        # Mac idiom widens controls + uses native traffic-light
        # window chrome. Worth the extra polish on bigger windows.
        # The "macCatalyst" / "scaled" choice can also be toggled
        # per-build in Xcode → Signing & Capabilities → Mac Catalyst
        # row if you ever want to compare both looks.
        MARKETING_VERSION: "1.9.17"
        CURRENT_PROJECT_VERSION: "5"
