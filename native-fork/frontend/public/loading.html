<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TableTop Forge</title>
  <style>
    /* Plain HTML so the splash renders without waiting for the
       React bundle to compile. Visible until main.rs finishes
       wait_for_backend() and rewrites window.location to the
       Express server. */
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0e16; color: #f4d28a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 22px; padding: 24px; box-sizing: border-box; }
    h1 { font-family: "Cinzel", "Times New Roman", serif; font-size: 36px; font-weight: 700; letter-spacing: 0.04em; margin: 0; }
    p  { font-size: 14px; color: rgba(244, 210, 138, 0.6); margin: 0; text-align: center; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(244, 210, 138, 0.2); border-top-color: #f4d28a; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .urls {
      display: flex; flex-direction: column; gap: 6px;
      background: rgba(244, 210, 138, 0.06);
      border: 1px solid rgba(244, 210, 138, 0.18);
      border-radius: 8px;
      padding: 12px 18px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 13px;
      max-width: 100%;
    }
    .urls .label { color: rgba(244, 210, 138, 0.55); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
    .urls .row { display: flex; gap: 8px; align-items: center; }
    .urls .url { color: #f4d28a; user-select: all; }
    .empty { color: rgba(244, 210, 138, 0.4); font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TableTop Forge</h1>
    <div class="spinner"></div>
    <p>Starting up — first launch can take a moment while the database initialises.</p>
    <div id="urls" class="urls" style="display:none;"></div>
  </div>
  <script>
    /* Receives `window.__forgeUrls = { local, lan }` from the Rust
       shell as soon as the port is picked. We render before the
       backend is actually up so the GM can already start reading
       the LAN URL out to players. */
    function renderForgeUrls() {
      var u = window.__forgeUrls;
      if (!u) return;
      var box = document.getElementById('urls');
      box.style.display = 'flex';
      var rows = '';
      rows += '<div><div class="label">This device</div><div class="row"><span class="url">' + (u.local || '') + '</span></div></div>';
      if (u.lan) {
        rows += '<div style="margin-top:6px;"><div class="label">Other devices on Wi-Fi</div><div class="row"><span class="url">' + u.lan + '</span></div></div>';
      } else {
        rows += '<div style="margin-top:6px;"><div class="label">Other devices on Wi-Fi</div><div class="row"><span class="empty">no LAN address detected</span></div></div>';
      }
      box.innerHTML = rows;
    }
    window.__renderForgeUrls = renderForgeUrls;
    renderForgeUrls();
  </script>
</body>
</html>
