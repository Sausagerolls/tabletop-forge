[package]
name = "tabletopforge"
version = "1.9.14"
description = "TableTop Forge — native desktop wrapper"
authors = ["Giant Mushroom Studio"]
edition = "2021"

[[bin]]
name = "tabletopforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
